<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		<!-- OG/Twitter/description tags are emitted via svelte:head (root layout
		     provides defaults; /area/ pages provide district-specific versions).
		     Crawlers take the FIRST og:image they find, so defaults must not
		     appear here ahead of page-specific tags. -->
		<meta property="og:site_name" content="ADInteract" />
		<meta property="og:locale" content="en_AE" />
		<meta name="twitter:site" content="@adinteract" />

		<!-- Search engine hints -->
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0a2318" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
		<title>ADInteract — Abu Dhabi Property Transactions</title>
		%sveltekit.head%

		<!-- Google Analytics 4 -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-FPRZ718QZM"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-FPRZ718QZM');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
