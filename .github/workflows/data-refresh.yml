name: Daily Data Refresh & Deploy

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 GST (UTC+4) every day
  workflow_dispatch:        # manually runnable from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Job 1: Download from ADREC → update Google Sheet → generate Parquet
  # ───────────────────────────────────────────────────────────────────────
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright (Chromium)
        run: playwright install chromium --with-deps

      - name: Fetch ADREC export
        run: python scripts/fetch_adrec.py

      # Upload raw CSV as a downloadable artifact (useful for debugging)
      - name: Save raw CSV artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrec-raw-${{ github.run_id }}
          path: scripts/data/adrec_raw.csv
          retention-days: 7

      - name: Update Google Sheet
        if: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/update_sheets.py

      - name: Transform → Parquet + meta.json
        run: python scripts/transform.py

      - name: Commit data files to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/transactions.parquet static/data/meta.json
          git diff --staged --quiet \
            || git commit -m "data: refresh $(date -u +%Y-%m-%d) [skip ci]"
          git push

  # ───────────────────────────────────────────────────────────────────────
  # Job 2: Build SvelteKit and deploy to GitHub Pages
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: refresh-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (picks up data commit from Job 1)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/ADInteract' }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
