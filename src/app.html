<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Abu Dhabi real estate transaction analytics — search, filter, and analyse property sales data powered by ADREC." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		<!-- Open Graph defaults (overridden per-page via svelte:head) -->
		<meta property="og:site_name" content="ADInteract" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://adinteract.co/brand/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:locale" content="en_AE" />

		<!-- Twitter / X Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@adinteract" />
		<meta name="twitter:image" content="https://adinteract.co/brand/og-image.png" />

		<!-- Search engine hints -->
		<meta name="robots" content="index, follow" />
		<meta name="theme-color" content="#0a2318" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
		<title>ADInteract — Abu Dhabi Property Transactions</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
