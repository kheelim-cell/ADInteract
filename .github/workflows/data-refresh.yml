name: Daily Data Refresh & Deploy

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 GST (UTC+4) every day
  workflow_dispatch:        # manually runnable from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Job 1: Scrape ADREC → update Google Sheet → generate Parquet
  # ───────────────────────────────────────────────────────────────────────
  refresh-data:
    runs-on: ubuntu-22.04   # pinned: Playwright 1.44 needs libasound2 (not in 24.04)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright (Chromium)
        run: playwright install chromium --with-deps

      - name: Fetch ADREC export
        run: python scripts/fetch_adrec.py

      # Always upload debug artifacts so failures can be diagnosed
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrec-debug-${{ github.run_id }}
          path: |
            scripts/data/adrec_raw.csv
            scripts/data/debug_screenshot.png
            scripts/data/debug_page.html
          retention-days: 7

      - name: Append new rows to Google Sheet
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/update_sheets.py

      - name: Download full Google Sheet → adrec_raw.csv
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/fetch_sheets.py

      - name: Transform → Parquet + meta.json
        run: python scripts/transform.py

      - name: Fetch ADREC Rental Index
        run: python scripts/fetch_rental.py

      # Upload rental debug artefacts even on failure
      - name: Upload rental debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rental-debug-${{ github.run_id }}
          path: |
            scripts/data/rental_debug_screenshot.png
            scripts/data/rental_debug_page.html
          retention-days: 7

      - name: Transform Rental → Parquet + rental_meta.json
        run: python scripts/transform_rental.py

      - name: Generate district summaries (SEO prose JSON)
        run: python scripts/generate_district_summaries.py

      - name: Commit data files to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static/data/transactions.parquet static/data/meta.json static/data/rental.parquet static/data/rental_meta.json src/lib/data/district_summaries.json
          git diff --staged --quiet \
            || git commit -m "data: refresh $(date -u +%Y-%m-%d) [skip ci]"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push

  # ───────────────────────────────────────────────────────────────────────
  # Job 2: Build SvelteKit and deploy to GitHub Pages
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: refresh-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (picks up data commit from Job 1)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
