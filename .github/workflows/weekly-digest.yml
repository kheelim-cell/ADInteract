name: Weekly Market Digest

on:
  schedule:
    - cron: '0 4 * * 1'   # 08:00 GST (UTC+4) every Monday
  workflow_dispatch:        # manually runnable from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and send weekly digest
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          # Reuses the existing frontend Supabase URL secret — same project, just
          # read server-side here. SUPABASE_SERVICE_ROLE_KEY is a NEW secret and
          # is optional: unset, the digest sends to GMAIL recipient only, exactly
          # like before this workflow changed. Set it (Supabase dashboard →
          # Project Settings → API → service_role) to start BCC'ing real
          # subscribers from email_subscribers.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/send_weekly_digest.py

      - name: Upload digest HTML (for review)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-digest-${{ github.run_id }}
          path: scripts/data/weekly_digest.html
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/notify_failure.py
