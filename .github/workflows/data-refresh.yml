name: Daily Data Refresh & Deploy

on:
  schedule:
    - cron: '0 2 * * *'   # 06:00 GST (UTC+4) every day
  workflow_dispatch:        # manually runnable from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Job 1: Scrape ADREC → update Google Sheet → generate Parquet
  # ───────────────────────────────────────────────────────────────────────
  refresh-data:
    runs-on: ubuntu-22.04   # pinned: Playwright 1.44 needs libasound2 (not in 24.04)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright (Chromium)
        run: playwright install chromium --with-deps

      - name: Fetch ADREC export
        # Intentionally NOT continue-on-error: a silent fetch failure here
        # used to mask 5+ days of stale data before the freshness check caught
        # it. Fail the run loudly the first day it breaks so we know to fix it.
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/fetch_adrec.py

      # Always upload debug artifacts so failures can be diagnosed
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrec-debug-${{ github.run_id }}
          path: |
            scripts/data/adrec_raw.csv
            scripts/data/debug_screenshot.png
            scripts/data/debug_page.html
          retention-days: 7

      - name: Transform → Parquet + meta.json (incremental append)
        run: python scripts/transform.py

      - name: Append new rows to Google Sheet (backup — non-critical)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/update_sheets.py || echo "⚠️  Sheet update failed — parquet already written, continuing"

      # Rental index fetch moved to its own quarterly workflow
      # (.github/workflows/rental-refresh.yml) — the ADREC interactive-map
      # endpoint it scrapes started serving a Fortinet WAF CAPTCHA challenge,
      # likely triggered by daily automated traffic. Running it 4x/year
      # instead of 365x/year should keep it well under whatever request-rate
      # threshold trips the challenge. The rental data itself changes slowly
      # (it's an annual benchmark index), so quarterly freshness is plenty.

      - name: Generate district summaries (SEO prose JSON)
        run: python scripts/generate_district_summaries.py

      - name: Compute district investment scores
        run: python scripts/compute_district_scores.py

      - name: Compute off-plan project pipeline
        run: python scripts/compute_project_pipeline.py

      - name: Fetch USD/AED exchange rate
        run: python scripts/fetch_exchange_rate.py

      - name: Check data freshness (fails loudly if stale)
        run: python scripts/check_freshness.py

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-report-${{ github.run_id }}
          path: scripts/data/freshness_report.txt
          retention-days: 14

      - name: Commit data files to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f static/data/transactions.parquet static/data/meta.json src/lib/data/district_summaries.json src/lib/data/district_scores.json src/lib/data/project_pipeline.json static/data/config.json
          git diff --staged --quiet \
            || git commit -m "data: refresh $(date -u +%Y-%m-%d) [skip ci]"
          git stash --include-untracked || true
          git pull --rebase origin main
          git push

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/notify_failure.py

  # ───────────────────────────────────────────────────────────────────────
  # Job 2: Build SvelteKit and deploy to GitHub Pages
  # ───────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: refresh-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (picks up data commit from Job 1)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # This job is Node-only otherwise — Python is set up here solely for the
      # shared notify_failure.py script, and only on the failure path so it
      # costs nothing on a normal successful deploy.
      - name: Set up Python (failure alert only)
        if: failure()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/notify_failure.py
